server:
  port: 8146

spring:
  application:
    name: surf-equipment-system
  
  datasource:
    url: jdbc:mysql://127.0.0.1:3362/surf_equipment?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: admin
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  data:
    redis:
      host: 127.0.0.1
      port: 6435
      timeout: 10000ms

logging:
  level:
    com.surf: DEBUG
    org.hibernate.SQL: DEBUG

# 角色访问控制
# DIRECTOR 馆长：可见并操作全部档位/设备
# COACH    浪道教练：仅可查看并调整授权档位上的防滑扶手和缓冲挡垫
surf:
  security:
    # 未携带 X-Role 请求头时的兜底角色（安全默认：教练）
    default-role: COACH
    # 教练被授权的浪高档位编码（高浪 HIGH 不在授权范围内，用于验证越权拦截）
    coach-authorized-wave-levels:
      - LOW
      - MEDIUM
    auxiliary-equipment-types:
      - 防滑扶手
      - 缓冲挡垫
